<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">TesselGUI Revision 4 editor concept</title>
  <desc id="description">Two views show a charcoal editor with a fine square grid. The settings drawer starts closed, allowing the editor to fill the window. When opened, it extends toward the right screen edge and the editor reflows around it. A circular export indicator reads 64 percent in both views.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#28282B"/>
    </pattern>
    <g id="editor-text" font-family="Consolas, monospace" font-size="13">
      <text x="0" y="0" fill="#72AAA5">export</text>
      <text x="54" y="0" fill="#E6E3E1">const workspace = {</text>
      <text x="17" y="24" fill="#E6E3E1">mode:</text>
      <text x="64" y="24" fill="#A3B58A">"editor",</text>
      <text x="17" y="48" fill="#E6E3E1">layout:</text>
      <text x="80" y="48" fill="#A3B58A">"adaptive"</text>
      <text x="0" y="72" fill="#E6E3E1">};</text>
    </g>
    <g id="progress">
      <circle cx="0" cy="0" r="19" fill="#1B1B1D" stroke="#73737B" stroke-width="3"/>
      <circle cx="0" cy="0" r="19" fill="none" stroke="#960018" stroke-width="4" pathLength="100" stroke-dasharray="64 36" transform="rotate(-90)"/>
      <text y="4" text-anchor="middle" font-size="11" font-weight="700">64%</text>
      <text x="32" y="5" font-size="13">Exporting workspace</text>
    </g>
  </defs>
  <rect width="1120" height="360" rx="12" fill="#141416"/>
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#E6E3E1">
    <text x="24" y="35" font-size="18" font-weight="700">Workspace · Settings closed</text>
    <g transform="translate(24 54)">
      <rect width="512" height="280" rx="5" fill="#232326" stroke="#73737B"/>
      <rect x="1" y="42" width="510" height="184" fill="#1B1B1D"/>
      <rect x="1" y="42" width="510" height="184" fill="url(#grid)"/>
      <path d="M0 226H512" stroke="#43434A"/>
      <text x="16" y="26" font-size="14" font-weight="700">workspace.ts</text>
      <path d="M16 39H108" stroke="#960018" stroke-width="3"/>
      <rect x="405" y="8" width="92" height="26" rx="3" fill="#1B1B1D" stroke="#73737B"/>
      <text x="451" y="26" text-anchor="middle" font-size="13">Settings ›</text>
      <use href="#editor-text" x="21" y="82"/>
      <use href="#progress" x="32" y="253"/>
    </g>
    <text x="568" y="35" font-size="18" font-weight="700">Workspace · Settings open</text>
    <g transform="translate(568 54)">
      <rect x="336" width="176" height="280" rx="5" fill="#232326" stroke="#73737B"/>
      <rect width="338" height="280" rx="5" fill="#232326" stroke="#73737B"/>
      <rect x="1" y="42" width="336" height="184" fill="#1B1B1D"/>
      <rect x="1" y="42" width="336" height="184" fill="url(#grid)"/>
      <path d="M0 226H338M338 42H512" stroke="#43434A"/>
      <text x="16" y="26" font-size="14" font-weight="700">workspace.ts</text>
      <path d="M16 39H108" stroke="#960018" stroke-width="3"/>
      <rect x="232" y="8" width="92" height="26" rx="3" fill="#1B1B1D" stroke="#73737B"/>
      <text x="278" y="26" text-anchor="middle" font-size="13">Settings ‹</text>
      <use href="#editor-text" x="21" y="82"/>
      <use href="#progress" x="32" y="253"/>
      <text x="352" y="26" font-size="14" font-weight="700">Settings</text>
      <text x="352" y="69" font-size="12">Appearance</text>
      <rect x="352" y="78" width="144" height="30" rx="3" fill="#1B1B1D" stroke="#73737B"/>
      <text x="364" y="98" font-size="13">Dark</text>
      <path d="m476 90 5 5 5-5" fill="none" stroke="#E6E3E1" stroke-width="1.5"/>
      <text x="352" y="136" font-size="12">Density</text>
      <rect x="352" y="145" width="144" height="30" rx="3" fill="#1B1B1D" stroke="#73737B"/>
      <text x="364" y="165" font-size="13">Compact</text>
      <path d="m476 157 5 5 5-5" fill="none" stroke="#E6E3E1" stroke-width="1.5"/>
      <text x="352" y="257" font-size="12">Nearest screen edge →</text>
      <path d="M524 0V280" fill="none" stroke="#73737B" stroke-dasharray="4 5"/>
    </g>
  </g>
</svg>
